version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-ticketing}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ticketing-api
    environment:
      PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-ticketing}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-60}
      CHECKOUT_HOLD_SECONDS: ${CHECKOUT_HOLD_SECONDS:-60}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis

  # Owns reservation expiry: holds the per-reservation timers and releases
  # held stock when a hold times out, off the API's Redis connection.
  reservation-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ticketing-reservation-worker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-ticketing}
      # The API owns schema sync; two processes racing TypeORM's DDL on a
      # cold database is asking for trouble.
      DB_SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-60}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CHECKOUT_HOLD_SECONDS: ${CHECKOUT_HOLD_SECONDS:-60}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
