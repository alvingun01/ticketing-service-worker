name: Build, push, and deploy worker

# Builds the reservation-worker image on GitHub's x86_64 runners (matching the
# GCP VMs), pushes it to Docker Hub tagged with the git SHA plus a stable
# `worker` tag, then SSHs into VM2 to pull and restart. Triggered by pushes to
# main and manual runs from the Actions tab.
#
# The ticketing-service submodule is updated to its main branch on every build,
# so shared-code changes in
# https://github.com/alvingun01/ticketing-service deploy here without a manual
# pin bump.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-service-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update ticketing-service submodule to main
        run: git submodule update --remote ticketing-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_REPO }}:worker
            ${{ env.IMAGE_REPO }}:worker-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy worker to VM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ${{ secrets.VM2_USER }}
          key: ${{ secrets.VM2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/vm2
            docker compose pull reservation-worker
            docker compose up -d reservation-worker
            docker compose ps
